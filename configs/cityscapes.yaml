# arguments for dataset
dataset: cityscapes
nclass: 19
crop_size: 801
data_root: /path/to/cityscapes  # or pass --data-root on the command line

# arguments for training
epochs: 240
batch_size: 8
lr: 0.001  # 1GPUs
lr_multi: 1.0
criterion:
  name: OHEM
  kwargs:
    ignore_index: 255
    thresh: 0.7
    min_kept: 100000
conf_thresh: 0.0

# arguments for model
backbone: resnet101
multi_grid: False
replace_stride_with_dilation: [False, True, True]
dilations: [12, 24, 36]
